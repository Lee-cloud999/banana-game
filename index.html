<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="바나나 키우기">
<meta name="theme-color" content="#fff7d6">
<title>바나나 키우기</title>
<style>
  :root{--bg:#fff7d6;--card:#fffdf2;--ink:#5a3a12;--yellow:#ffd84a;--green:#6cc04a;--pink:#ff9aa8;--blue:#6ab7ff;--orange:#ffb04a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  #app{max-width:440px;margin:0 auto;min-height:100%;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
  header{display:flex;justify-content:space-between;align-items:center}
  h1{font-size:20px;margin:0}
  #lv{background:var(--yellow);border:2px solid #8a4b12;border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px}
  .exp{height:10px;background:#f1e6b0;border-radius:99px;overflow:hidden;border:1.5px solid #c9a94a}
  .exp>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb04a,#ffd84a);transition:width .4s}
  #stage{position:relative;background:linear-gradient(#cdeeff 0,#cdeeff 62%,#bfe39a 62%);border:3px solid #e6d28a;border-radius:24px;height:300px;overflow:hidden}
  #bubble{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid #e6d28a;border-radius:16px;padding:7px 14px;font-size:14px;font-weight:600;max-width:90%;text-align:center;transition:opacity .3s;z-index:2}
  #pet{position:absolute;left:50%;bottom:14px;width:200px;height:230px;margin-left:-100px;transform-origin:50% 90%;cursor:pointer;transition:transform .4s}
  #pet img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;user-select:none;-webkit-user-drag:none;display:block}
  #pet img.gold{filter:saturate(1.35) brightness(1.06) drop-shadow(0 0 10px #ffe36b)}
  #pet.bounce{animation:bounce .5s ease}
  #pet.idle img{animation:idle 3s ease-in-out infinite}
  #pet.sleep img{animation:idle 5s ease-in-out infinite}
  @keyframes bounce{0%{transform:scale(var(--s)) translateY(0)}35%{transform:scale(var(--s)) translateY(-26px)}70%{transform:scale(var(--s)) translateY(0) scaleY(.92)}100%{transform:scale(var(--s)) translateY(0)}}
  @keyframes idle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(1.5deg)}}
  .floaty{position:absolute;font-size:24px;pointer-events:none;animation:up 1s ease-out forwards;z-index:3}
  @keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}
  .stats{display:grid;gap:8px;background:var(--card);border:2px solid #efe0a0;border-radius:18px;padding:12px 14px}
  .row{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:8px;font-size:13px;font-weight:700}
  .bar{height:12px;background:#f1e6b0;border-radius:99px;overflow:hidden;border:1.5px solid #c9a94a}
  .bar>i{display:block;height:100%;width:50%;transition:width .4s,background .4s}
  .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  button{font:inherit;font-weight:800;font-size:15px;color:var(--ink);background:var(--yellow);border:2.5px solid #8a4b12;border-radius:16px;padding:12px 4px;box-shadow:0 4px 0 #8a4b12;cursor:pointer}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a4b12}
  button small{display:block;font-weight:600;font-size:11px;opacity:.7}
  button.sleepbtn{background:#d7e6ff}
  footer{display:flex;justify-content:space-between;font-size:12px;opacity:.7}
  footer a{color:inherit;cursor:pointer;text-decoration:underline}
  #modal{position:fixed;inset:0;background:rgba(90,58,18,.45);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
  #modal[hidden]{display:none}
  .mbox{background:#fffdf2;border:3px solid #8a4b12;border-radius:20px;padding:18px;width:100%;max-width:320px;display:grid;gap:12px;text-align:center;color:#5a3a12}
  .mbox p{margin:0;font-weight:700;font-size:16px}
  .mbox input{font:inherit;font-size:16px;padding:10px 12px;border:2px solid #c9a94a;border-radius:12px;background:#fff;color:#5a3a12;text-align:center}
  .mbtns{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
</style>
</head>
<body>


<div id="app">
  <header>
    <h1>🍌 <span id="nm">바나나</span> 키우기</h1>
    <div id="lv">Lv.1 아기 바나나</div>
  </header>
  <div class="exp"><i id="expbar"></i></div>

  <div id="stage">
    <div id="bubble">안녕! 나는 바나나야 🍌</div>
    <div id="pet" class="idle"></div>
  </div>

  <div class="stats">
    <div class="row"><span>🍽️ 배고픔</span><div class="bar"><i id="b-hunger"></i></div><span id="n-hunger"></span></div>
    <div class="row"><span>💛 기분</span><div class="bar"><i id="b-mood"></i></div><span id="n-mood"></span></div>
    <div class="row"><span>⚡ 에너지</span><div class="bar"><i id="b-energy"></i></div><span id="n-energy"></span></div>
  </div>

  <div class="btns">
    <button id="feed">🍌 먹이주기<small>배고픔 ↑</small></button>
    <button id="play">🎈 놀아주기<small>기분 ↑ 에너지 ↓</small></button>
    <button id="sleep" class="sleepbtn">🌙 재우기<small>에너지 ↑</small></button>
  </div>

  <footer>
    <span>바나나를 톡톡 쓰다듬어 보세요</span>
    <a id="reset">처음부터</a>
  </footer>
</div>


<div id="modal" hidden><div class="mbox"><p id="mtext"></p><input id="minput" maxlength="8" autocomplete="off"><div class="mbtns"><button id="mok">확인</button><button id="mcancel">취소</button></div></div></div>

/* ===== 게임 상태 ===== */
const KEY = 'banana-game-v1';
const STAGES = ['아기 바나나','꼬마 바나나','튼튼 바나나','멋쟁이 바나나','황금 바나나'];
const $ = id => document.getElementById(id);
let S;

function fresh(){ return {name:'바나나',hunger:70,mood:70,energy:80,exp:0,level:1,sleeping:false,last:Date.now()}; }
function load(){
  try{ S = JSON.parse(localStorage.getItem(KEY)) || fresh(); }catch(e){ S = fresh(); }
  // 자리 비운 동안의 변화 (최대 8시간, 너무 슬퍼지지 않게 최소값 유지)
  const away = Math.min((Date.now()-S.last)/1000, 8*3600);
  tick(away, true);
}
function save(){ S.last = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const clamp = (v,a=0,b=100)=>Math.max(a,Math.min(b,v));

function tick(sec, offline){
  const floor = offline ? 15 : 0;
  if(S.sleeping){
    S.energy = clamp(S.energy + sec*(10/3)); // 자는 동안 3초에 에너지 10 회복
    S.hunger = clamp(S.hunger - sec*0.02, floor);
    S.mood   = clamp(S.mood   - sec*0.01, floor);
    if(S.energy>=100 && !offline) wake('푹 잤다! 기운이 넘쳐요 ⚡');
    if(S.energy>=100 && offline) S.sleeping=false;
  }else{
    S.hunger = clamp(S.hunger - sec*0.05,  floor);
    S.mood   = clamp(S.mood   - sec*0.03,  floor);
    S.energy = clamp(S.energy - sec*0.02,  floor);
  }
}

/* ===== 표시 ===== */
let override = null, overrideTimer = null, msgTimer = null;
function currentFace(){
  if(override) return override;
  if(S.sleeping) return 'sleepy';
  if(S.hunger < 20 || S.mood < 15) return 'sad';
  if(S.mood < 35) return 'angry';
  if(S.energy < 20) return 'sleepy';
  if(S.mood > 80 && S.hunger > 50) return 'happy';
  return 'normal';
}
function setFace(face, ms){
  override = face; clearTimeout(overrideTimer);
  overrideTimer = setTimeout(()=>{override=null;render();}, ms);
  render();
}
function say(t, ms=3000){
  const b=$('bubble'); b.textContent=t; b.style.opacity=1;
  clearTimeout(msgTimer); msgTimer=setTimeout(()=>{b.style.opacity=0.0;}, ms);
}
function stageName(){ return STAGES[Math.min(STAGES.length-1, Math.floor((S.level-1)/2))]; }
function need(){ return 20 + S.level*10; }
function color(v){ return v>60?'#6cc04a':v>30?'#ffb04a':'#ff6b6b'; }

function render(){
  const face = currentFace();
  const gold = S.level >= 9;
  $('pet').innerHTML = petSVG(face, gold);
  $('pet').className = (S.sleeping?'sleep':'idle');
  const scale = Math.min(1.25, 0.7 + S.level*0.06);
  $('pet').style.setProperty('--s', scale);
  $('pet').style.transform = `scale(${scale})`;
  $('nm').textContent = S.name;
  $('lv').textContent = `Lv.${S.level} ${stageName()}`;
  $('expbar').style.width = (S.exp/need()*100)+'%';
  for(const k of ['hunger','mood','energy']){
    $('b-'+k).style.width = S[k]+'%';
    $('b-'+k).style.background = color(S[k]);
    $('n-'+k).textContent = Math.round(S[k]);
  }
  $('sleep').firstChild.textContent = S.sleeping ? '☀️ 깨우기' : '🌙 재우기';
}

function float(emoji){
  const e=document.createElement('div'); e.className='floaty'; e.textContent=emoji;
  e.style.left=(40+Math.random()*50)+'%'; e.style.bottom='170px';
  $('stage').appendChild(e); setTimeout(()=>e.remove(),1000);
}
function bounce(){ const p=$('pet'); p.classList.remove('bounce'); void p.offsetWidth; p.classList.add('bounce'); }

function gain(n){
  S.exp += n;
  while(S.exp >= need()){
    S.exp -= need(); S.level++;
    setFace('surprised', 2200); bounce(); float('🎉'); float('✨');
    say(`레벨 ${S.level}! ${stageName()}(이)가 됐어요 🎉`, 4000);
  }
}
function wake(msg){ S.sleeping=false; say(msg||'일어났어요!'); render(); }

/* ===== 행동 ===== */
$('feed').onclick = ()=>{
  if(S.sleeping) return say('쿨쿨... 자는 중이에요 💤');
  if(S.hunger >= 95){ setFace('surprised',1500); return say('배불러요! 더는 못 먹어요 😮'); }
  S.hunger = clamp(S.hunger+25); S.mood = clamp(S.mood+4); gain(3);
  setFace('eating',1800); bounce(); float('🍌'); say('냠냠! 맛있다 🍌');
  save();
};
$('play').onclick = ()=>{
  if(S.sleeping) return say('쿨쿨... 자는 중이에요 💤');
  if(S.energy < 15){ setFace('sleepy',1800); return say('너무 졸려서 못 놀겠어요... 😪'); }
  if(S.hunger < 15){ setFace('sad',1800); return say('배고파서 힘이 없어요 😢'); }
  S.mood = clamp(S.mood+20); S.energy = clamp(S.energy-10); S.hunger = clamp(S.hunger-5); gain(4);
  setFace('happy',1800); bounce(); float('🎈'); float('💛'); say('신난다! 또 놀아요! 🎈');
  save();
};
$('sleep').onclick = ()=>{
  if(S.sleeping){ return wake('안녕! 잘 잤어요 ☀️'); }
  if(S.energy >= 95){ setFace('surprised',1500); return say('하나도 안 졸려요! 😮'); }
  S.sleeping = true; say('zZZ... 잘 자요 🌙'); render(); save();
};
$('pet').onclick = ()=>{
  if(S.sleeping) return wake('으앗! 깜짝이야 😮');
  S.mood = clamp(S.mood+3); gain(1);
  setFace('happy',1200); bounce(); float('💛');
  say(['헤헤 간지러워요~','좋아좋아 💛','쓰다듬어 줘서 고마워요!','히히 😊'][Math.floor(Math.random()*4)],2000);
  save();
};
$('reset').onclick = async ()=>{
  const ok = await dialog('정말 처음부터 다시 키울까요? 지금 바나나는 사라져요.',{cancel:true});
  if(!ok) return;
  S = fresh(); render(); save();
  await askName(); render(); save();
};

function dialog(text,{input=false,def='',cancel=false}={}){
  return new Promise(res=>{
    const m=$('modal'),inp=$('minput'),ok=$('mok'),ca=$('mcancel');
    $('mtext').textContent=text; inp.hidden=!input; inp.value=def; ca.hidden=!cancel; m.hidden=false;
    if(input) setTimeout(()=>inp.focus(),50);
    const done=v=>{m.hidden=true;ok.onclick=ca.onclick=null;res(v);};
    ok.onclick=()=>done(input?inp.value:true);
    ca.onclick=()=>done(input?null:false);
  });
}
async function askName(){
  const n = await dialog('바나나 이름을 지어주세요 🍌',{input:true,def:S.name||'바나나'});
  if(n && n.trim()) S.name = n.trim().slice(0,8);
}

/* ===== 시작 ===== */
let isNew; try{ isNew = !localStorage.getItem(KEY); }catch(e){ isNew = true; }
load();
render(); save();
if(isNew) askName().then(()=>{ render(); save(); });
setInterval(()=>{ tick(1); render(); }, 1000);
setInterval(save, 5000);
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) save();
  else { const away=Math.min((Date.now()-S.last)/1000, 8*3600); tick(away,true); render(); }
});
window.addEventListener('pagehide', save);
</script>
</body>
